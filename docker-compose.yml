services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tickets-event-backend:latest
    container_name: tickets-event-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
